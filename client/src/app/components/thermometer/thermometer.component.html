<div class="progress">
	<!--TODO: set style.background-color based on the level of popularity and style.width via the popularity's percent. Display percent.-->
  <div class="progress-bar" role="progressbar" [style.width]="popularity.percentageString" [style.background-color]="(popularity.percent < .25) ? 'red' : (popularity.percent < .5) ? 'orange' : (popularity.percent < .75) ? 'yellow' : 'green'">
    <span class="progress-bar-text">Popularity: {{popularity.percentageString}}</span>
  </div>
</div>
